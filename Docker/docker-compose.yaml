services:

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode
    container_name: namenode
    environment:
      - CLUSTER_NAME=abassurance-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9870:9870"
      - "9000:9000"
    networks:
      - bigdata

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode
    container_name: datanode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870
    depends_on:
      - namenode
    networks:
      - bigdata

  kafka:
    image: apache/kafka:latest
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    networks:
      - bigdata

  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: pyspark-app
    depends_on:
      - namenode
      - datanode
      - kafka
    environment:
      - SPARK_LOCAL_IP=127.0.0.1
    networks:
      - bigdata

  sonarqube:
    # la qualité (bugs, failles de sécu, duplication, couverture de tests...)
    image: sonarqube:26.8.0.126808-community
    hostname: sonarqube
    container_name: sonarqube
    ports:
      - "9001:9000"   # interface web -> http://localhost:9001 (login par défaut admin/admin)
    ulimits:
      # SonarQube embarque Elasticsearch, qui a besoin de pouvoir ouvrir
      # beaucoup de fichiers et de threads en même temps, sinon il refuse de démarrer
      nofile:
        soft: 65536
        hard: 65536
      nproc: 4096
    volumes:
      # Volumes nommés = les données survivent même si tu supprimes le conteneur
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - bigdata   # facultatif : SonarQube n'a pas besoin de parler à Kafka/Spark,
                  # mais ça ne pose aucun problème de le mettre sur le même réseau

networks:
  bigdata:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: