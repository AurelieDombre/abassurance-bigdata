# pytest.ini
#
# pythonpath = app  : récupère outils.py dans le dossier app/". 
# testpaths = tests : pytest ne cherche les tests que dans le dossier tests/.

[pytest]
pythonpath = app src/pipeline
testpaths = tests
# Sans cette ligne, pytest prendrait la fonction tester_porte (importée) pour un test,
# car son nom commence par "test".
python_functions = test_*
