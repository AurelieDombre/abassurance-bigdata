sonar.projectKey=AbAssurance-bigadata
sonar.projectName=AbAssurance-bigadata
sonar.host.url=http://localhost:9000

# Où est le code, où sont les tests
sonar.sources=app,src,streaming_topics,generate_dataset.py,en_ligne
sonar.tests=tests
sonar.python.version=3.12

# Ce qu'on ne veut pas analyser (données, doc, environnement virtuel)
sonar.exclusions=data/**,Documentations/**,.venv/**,logs/**

# Le rapport de couverture produit par pytest (étape suivante)
sonar.python.coverage.reportPaths=coverage.xml,coverage_fraude.xml

# Fichiers exclus du CALCUL DE COUVERTURE (toujours analysés pour la qualité) :
# ce sont des points d'entrée qui démarrent Spark, lisent Hadoop ou Kafka,
# ou affichent des pages Streamlit. Leur logique de calcul est dans outils.py,
# preparer_dataset_fraude.py et nettoyage_donnees_ia.py, eux testés.
sonar.coverage.exclusions=app/app.py,app/pages/**,streaming_topics/**,src/prediction/**,generate_dataset.py,tools/**