sonar.projectKey=AbAssurance-bigadata
sonar.projectName=AbAssurance-bigadata
sonar.host.url=http://localhost:9000

# Où est le code, où sont les tests
sonar.sources=app,src,streaming_topics,generate_dataset.py
sonar.tests=tests
sonar.python.version=3.12

# Ce qu'on ne veut pas analyser (données, doc, environnement virtuel)
sonar.exclusions=data/**,Documentations/**,.venv/**,logs/**

# Le rapport de couverture produit par pytest (étape suivante)
sonar.python.coverage.reportPaths=coverage.xml,coverage_fraude.xml